<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Local delivery ZK Navigator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f12;--card:#1a1a20;--card-hover:#22222a;--text:#f0f0f5;--text-sec:#888899;--border:#2a2a35;--danger:#e53935;--success:#4caf50;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:110px}
.header{background:linear-gradient(135deg,#1a1a20 0%,#151518 100%);padding:18px 16px 14px;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header h1{font-size:22px;font-weight:800;background:linear-gradient(90deg,#f5a623,#e74c3c,#27ae60,#2ecc71);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--text-sec);font-size:12px;margin-top:4px}
.shop-tabs{display:flex;gap:6px;padding:12px 10px;overflow-x:auto;scrollbar-width:none;position:sticky;top:70px;background:var(--bg);z-index:99;border-bottom:1px solid var(--border)}
.shop-tabs::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:10px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text-sec);font-size:12px;font-weight:700;cursor:pointer;transition:.2s;white-space:nowrap}
.tab-btn.active{color:#fff;border-color:transparent}
.tab-btn[data-shop="beer"].active{background:linear-gradient(135deg,#f5a623,#d48a1a)}
.tab-btn[data-shop="pizza"].active{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.tab-btn[data-shop="galia"].active{background:linear-gradient(135deg,#27ae60,#1e8449)}
.tab-btn[data-shop="fruits"].active{background:linear-gradient(135deg,#2ecc71,#27ae60)}

/* ===== ПОДТАБЫ ===== */
.sub-tabs{display:flex;gap:6px;padding:12px 0;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab-btn{flex-shrink:0;padding:7px 14px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text-sec);font-size:11px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
.sub-tab-btn.active{color:#fff;border-color:transparent}

.shop-page[data-shop="beer"] .sub-tab-btn.active{background:linear-gradient(135deg,#f5a623,#d48a1a)}
.shop-page[data-shop="pizza"] .sub-tab-btn.active{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.shop-page[data-shop="galia"] .sub-tab-btn.active{background:linear-gradient(135deg,#27ae60,#1e8449)}
.shop-page[data-shop="fruits"] .sub-tab-btn.active{background:linear-gradient(135deg,#2ecc71,#27ae60)}

/* ===== КАТЕГОРИИ ВНУТРИ МАГАЗИНА ===== */
.cat-block{display:none}
.cat-block.active{display:block}

.min-banner{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;margin:10px 16px 0;padding:8px 12px;text-align:center;font-size:12px;color:var(--text-sec);font-weight:600}
.min-banner b{color:var(--text)}
.min-banner .prog{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.min-banner .prog-bar{height:100%;background:linear-gradient(90deg,#f5a623,#ffd700);border-radius:2px;transition:width .3s;width:0%}
.shop-page{display:none;padding:16px}
.shop-page.active{display:block}
.shop-page .title{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.products{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:480px){.products{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--border);transition:.2s;position:relative;overflow:hidden}
.card:hover{border-color:rgba(255,255,255,.15);transform:translateY(-1px)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-name{font-size:14px;font-weight:700;line-height:1.3;flex:1}
.card-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;text-transform:uppercase;white-space:nowrap}
.badge-new{background:#4caf50;color:#fff}
.badge-hit{background:#f5a623;color:#1a1200}
.badge-abv{background:rgba(245,166,35,.15);color:#f5a623;border:1px solid rgba(245,166,35,.3)}
.card-desc{font-size:11px;color:var(--text-sec);margin-bottom:10px;line-height:1.35}
.card-foot{display:flex;justify-content:space-between;align-items:center}
.card-price{font-size:17px;font-weight:800}
.card-price .unit{font-size:10px;color:var(--text-sec);font-weight:500}
.add-btn{width:36px;height:36px;border-radius:10px;border:none;font-size:18px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.add-btn:hover{transform:scale(1.05)}
.add-btn:active{transform:scale(.95)}
.qty{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:3px}
.qty-btn{width:28px;height:28px;border-radius:8px;border:none;background:var(--card);color:var(--text);font-size:14px;font-weight:700;cursor:pointer}
.qty-btn:hover{background:#333}
.qty-val{font-size:13px;font-weight:700;min-width:44px;text-align:center}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(26,26,32,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:200;transform:translateY(100%);transition:transform .3s}
.bottom-bar.visible{transform:translateY(0)}
.cart-info{display:flex;flex-direction:column}
.cart-count{font-size:11px;color:var(--text-sec)}
.cart-total{font-size:20px;font-weight:800}
.order-btn{border:none;padding:13px 24px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;color:#fff}
.order-btn:hover:not(:disabled){transform:scale(1.03)}
.order-btn:disabled{opacity:.35;cursor:not-allowed}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--card);width:100%;max-width:500px;max-height:85vh;border-radius:24px 24px 0 0;padding:22px 18px;transform:translateY(100%);transition:transform .3s;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:18px;font-weight:700}
.modal-close{width:34px;height:34px;border-radius:50%;border:none;background:var(--bg);color:var(--text);font-size:16px;cursor:pointer}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.cart-item-info{flex:1}
.cart-item-name{font-weight:600;font-size:13px}
.cart-item-price{font-size:11px;color:var(--text-sec)}
.cart-item-total{font-weight:700;margin-left:10px;white-space:nowrap}
.remove-btn{background:rgba(229,57,53,.15);color:var(--danger);border:none;width:26px;height:26px;border-radius:6px;cursor:pointer;margin-left:6px;font-size:12px}
.empty-cart{text-align:center;padding:30px;color:var(--text-sec)}
.hint{background:rgba(229,57,53,.1);border:1px solid rgba(229,57,53,.2);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#ff6b6b;text-align:center;font-weight:600}
.hint.ok{background:rgba(76,175,80,.1);border-color:rgba(76,175,80,.2);color:var(--success)}
.notify{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--success);color:#fff;padding:10px 20px;border-radius:10px;font-weight:600;font-size:13px;z-index:400;transition:transform .3s;box-shadow:0 4px 15px rgba(76,175,80,.3)}
.notify.show{transform:translateX(-50%) translateY(0)}
.notify.err{background:var(--danger);box-shadow:0 4px 15px rgba(229,57,53,.3)}
.success-screen{text-align:center;padding:30px 20px}
.success-screen .icon{font-size:56px;margin-bottom:12px}
.success-screen .title{font-size:20px;font-weight:700;margin-bottom:6px}
.success-screen .sub{font-size:14px;color:var(--text-sec);margin-bottom:20px}
.close-btn{background:linear-gradient(135deg,#f5a623,#d48a1a);color:#1a1200;border:none;padding:14px 28px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>

<!-- ===== FRUITS ===== -->

<!-- Modal -->
<div class="modal-overlay" id="cartModal">

</div>

<div class="notify" id="notify">Додано!</div>

let cart={};
let currentShop='beer';

function getPrice(item,qty){
  if(item.step) return item.price*(qty/item.step);
  if(item.unit==='0.5 л'||item.unit==='500 мл') return item.price*(qty/0.5);
  return item.price*qty;
}
function getQtyText(item,qty){
  if(item.step===50) return qty+' г';
  if(item.step===100) return qty+' г';
  if(item.step===500) return (qty/1000).toFixed(1)+' кг';
  if(item.unit==='0.5 л'||item.unit==='500 мл') return qty+' л';
  return qty+' шт';
}
function getBasePrice(item){
  if(item.step===50) return item.price+' грн';
  if(item.step===100) return item.price+' грн';
  if(item.step===500) return (item.price*2)+' грн';
  if(item.unit==='0.5 л'||item.unit==='500 мл') return item.price+' грн';
  return item.price+' грн';
}
function getUnitLabel(item){
  if(item.step===50) return 'за 50 г';
  if(item.step===100) return 'за 100 г';
  if(item.step===500) return 'за 0.5 кг';
  if(item.unit==='0.5 л'||item.unit==='500 мл') return item.unit;
  return 'шт';
}

function renderAll(){
  for(const shop in DATA){
    for(const cat in DATA[shop]){
      const el=document.getElementById('list-'+shop+'-'+cat);
      if(!el) continue;
      el.innerHTML=DATA[shop][cat].map(p=>{
        const inCart=cart[p.id]; const qty=inCart?inCart.qty:0;
        let badges='';
        if(p.badge==='new') badges+='<span class="card-badge badge-new">NEW</span>';
        else if(p.badge==='hit') badges+='<span class="card-badge badge-hit">HIT</span>';
        if(p.abv) badges+=`<span class="card-badge badge-abv">${p.abv}</span>`;
        const qtyText=getQtyText(p,qty);
        return `<div class="card">
          <div class="card-head"><div class="card-name">${p.name}</div><div style="display:flex;gap:4px;flex-wrap:wrap">${badges}</div></div>
          <div class="card-desc">${p.desc}</div>
          <div class="card-foot">
            <div class="card-price" style="color:${SHOPS[shop].accent}">${getBasePrice(p)}<div class="unit">${getUnitLabel(p)}</div></div>
            ${qty===0?`<button class="add-btn" style="background:${SHOPS[shop].accent};color:#fff" onclick="addCart('${p.id}')">+</button>`
            :`<div class="qty"><button class="qty-btn" onclick="changeQty('${p.id}',-1)">−</button><span class="qty-val">${qtyText}</span><button class="qty-btn" onclick="changeCart('${p.id}',1)">+</button></div>`}
          </div>
        </div>`;
      }).join('');
    }
  }
}

function findProduct(id){
  for(const shop in DATA) for(const cat in DATA[shop]){const p=DATA[shop][cat].find(x=>x.id===id);if(p)return p;}
  return null;
}
function addCart(id){
  const p=findProduct(id);if(!p)return;
  const startQty=p.step?p.step:(p.unit==='0.5 л'||p.unit==='500 мл'?0.5:1);
  cart[id]={...p,qty:startQty};
  showNotify('Додано: '+p.name);renderAll();updateBar();
}
function changeQty(id,delta){
  if(!cart[id])return;const p=findProduct(id);
  if(p.step){const nq=cart[id].qty+delta*p.step;if(nq<p.step){delete cart[id];}else{cart[id].qty=nq;}}
  else{const u=(p.unit==='0.5 л'||p.unit==='500 мл'?0.5:1);const nq=+(cart[id].qty+delta*u).toFixed(1);if(nq<u){delete cart[id];}else{cart[id].qty=nq;}}
  renderAll();updateBar();renderModal();
}
function changeCart(id,delta){changeQty(id,delta);}

function calcTotal(){
  return Object.values(cart).reduce((s,item)=>s+getPrice(item,item.qty),0);
}
function calcShopTotal(shopId){
  return Object.values(cart).filter(i=>i.id.startsWith(shopId[0])||i.id.startsWith(shopId[1])).reduce((s,item)=>s+getPrice(item,item.qty),0);
}

function updateBar(){
  const items=Object.values(cart);const count=items.length;const total=calcTotal();
  const bar=document.getElementById('bottomBar');
  if(count>0){bar.classList.add('visible');document.getElementById('cartCount').textContent=count+' '+decl(count,['товар','товари','товарів']);document.getElementById('cartTotal').textContent=Math.round(total)+' грн';}
  else{bar.classList.remove('visible');}
  const min=SHOPS[currentShop].min;const pct=Math.min((total/min)*100,100);
  document.getElementById('minText').textContent=min+' грн';document.getElementById('progBar').style.width=pct+'%';
}
function decl(n,forms){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return forms[2];if(n1>1&&n1<5)return forms[1];if(n1===1)return forms[0];return forms[2];}

function showNotify(t,err){
  const el=document.getElementById('notify');el.textContent=t;el.className='notify'+(err?' err':'');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);
}

/* ===== ПЕРЕКЛЮЧЕНИЕ ПОДТАБОВ ===== */
function switchSubTab(shop, cat){
  const page = document.querySelector(`.shop-page[data-shop="${shop}"]`);
  if(!page) return;
  page.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
  page.querySelectorAll('.cat-block').forEach(b => b.classList.remove('active'));
  const btn = page.querySelector(`.sub-tab-btn[data-cat="${cat}"]`);
  const block = page.querySelector(`.cat-block[data-cat="${cat}"]`);
  if(btn) btn.classList.add('active');
  if(block) block.classList.add('active');
}

/* ===== ОСНОВНЫЕ ТАБЫ ===== */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.shop-page').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    currentShop=btn.dataset.shop;
    const page = document.querySelector(`.shop-page[data-shop="${currentShop}"]`);
    page.classList.add('active');
    const acc=SHOPS[currentShop].accent;
    document.getElementById('orderBtn').style.background='linear-gradient(135deg,'+acc+','+acc+')';
    document.getElementById('confirmOrder').style.background='linear-gradient(135deg,'+acc+','+acc+')';
    // Активируем первый подтаб
    const firstSub = page.querySelector('.sub-tab-btn');
    if(firstSub) switchSubTab(currentShop, firstSub.dataset.cat);
    updateBar();
  });
});

/* ===== ОБРАБОТЧИКИ ПОДТАБОВ ===== */
document.querySelectorAll('.sub-tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const shop = btn.closest('.shop-page').dataset.shop;
    switchSubTab(shop, btn.dataset.cat);
  });
});

// Modal
document.getElementById('orderBtn').addEventListener('click',()=>{renderModal();document.getElementById('cartModal').classList.add('open');});
document.getElementById('closeModal').addEventListener('click',()=>document.getElementById('cartModal').classList.remove('open'));
document.getElementById('cartModal').addEventListener('click',e=>{if(e.target===document.getElementById('cartModal'))document.getElementById('cartModal').classList.remove('open');});

function renderModal(){
  const container=document.getElementById('cartItems');const hint=document.getElementById('minOrderHint');const btn=document.getElementById('confirmOrder');
  const items=Object.values(cart);const total=calcTotal();const min=SHOPS[currentShop].min;
  if(total<min){const need=Math.ceil(min-total);hint.innerHTML=`⚠️ Додайте ще на <b>${need} грн</b> для ${SHOPS[currentShop].name}`;hint.classList.remove('ok');btn.disabled=true;btn.textContent=`❌ Ще ${need} грн`;}
  else{hint.innerHTML=`✅ Мінімальна сума досягнуто!`;hint.classList.add('ok');btn.disabled=false;btn.textContent='✅ Підтвердити замовлення';}
  if(items.length===0){container.innerHTML='<div class="empty-cart">🍺 Кошик порожній</div>';document.getElementById('modalTotal').textContent='0 грн';return;}
  let t=0;container.innerHTML=items.map(item=>{const it=getPrice(item,item.qty);t+=it;return `<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${item.name}</div><div class="cart-item-price">${getQtyText(item,item.qty)} × ${item.price} грн</div></div><div style="display:flex;align-items:center"><span class="cart-item-total" style="color:${SHOPS[currentShop].accent}">${Math.round(it)} грн</span><button class="remove-btn" onclick="removeCart('${item.id}')">🗑</button></div></div>`;}).join('');
  document.getElementById('modalTotal').textContent=Math.round(t)+' грн';
}
function removeCart(id){delete cart[id];renderAll();updateBar();renderModal();}

// ===== ОФОРМЛЕННЯ ЗАМОВЛЕННЯ =====
document.getElementById('confirmOrder').addEventListener('click',()=>{
  const items=Object.values(cart);
  if(items.length===0)return;
  const total=calcTotal();const min=SHOPS[currentShop].min;
  if(total<min){showNotify(`Мінімум ${min} грн`,true);return;}

  const productsData={};let totalSum=0;
  items.forEach(item=>{const it=getPrice(item,item.qty);totalSum+=it;productsData[item.id]={name:item.name,price:item.price,count:item.qty,unit:item.step===50||item.step===100?'г':(item.step===500?'кг':(item.unit==='0.5 л'||item.unit==='500 мл'?'л':'шт'))};});

  const payload={shop:currentShop,products:productsData,total:Math.round(totalSum)};
  const payloadStr=JSON.stringify(payload);

  console.log('[WebApp] ====== SEND DATA ======');
  console.log('[WebApp] payload:',payloadStr);
  console.log('[WebApp] platform:',tg.platform);
  console.log('[WebApp] version:',tg.version);

  try{
    tg.sendData(payloadStr);
    console.log('[WebApp] ✅ sendData() OK');

    tg.showAlert('✅ Замовлення відправлено! Перевірте чат з ботом для продовження оформлення.',()=>{
      console.log('[WebApp] alert closed by user');
    });

    document.getElementById('cartItems').innerHTML=`<div class="success-screen"><div class="icon">🍺</div><div class="title" style="color:${SHOPS[currentShop].accent}">Замовлення відправлено!</div><div class="sub">Перевірте чат з ботом.<br>Менеджер зателефонує для підтвердження.</div><button class="close-btn" onclick="window.Telegram.WebApp.close()">Закрити вікно</button></div>`;
    document.getElementById('minOrderHint').style.display='none';
    document.getElementById('confirmOrder').style.display='none';
    document.querySelector('.modal-head').style.display='none';
    document.getElementById('modalTotal').parentElement.style.display='none';

  }catch(err){
    console.error('[WebApp] ❌ ERROR:',err);
    showNotify('Помилка: '+err.message,true);
  }
});

renderAll();
